packages:
  - "apps/*"

# sqlite3's install script downloads its prebuilt binary for the current
# platform (falling back to a source build only when no prebuild exists), so
# it must be allowed to run or the module loads nothing.
# esbuild's postinstall is required to put its platform binary in place.
allowBuilds:
  esbuild: true
  sqlite3: true

# Only resolve package versions published at least 3 days ago, so a compromised
# or broken release has time to be pulled before it can enter the lockfile.
minimumReleaseAge: 4320
