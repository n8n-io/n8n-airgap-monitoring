packages:
  - "apps/*"

# sqlite3's install script downloads its prebuilt binary for the current
# platform (falling back to a source build only when no prebuild exists), so
# it must be allowed to run or the module loads nothing.
# esbuild's postinstall is required to put its platform binary in place.
allowBuilds:
  esbuild: true
  sqlite3: true

# The Vue toolchain cannot run TypeScript 7 (the native port) yet: vue-tsc
# resolves `typescript/lib/tsc.js`, which TS 7 no longer exports, and
# typescript-eslint caps its peer range below 6.1. The dashboard pins the last
# 6.x via `"typescript": "catalog:vue"`.
catalogs:
  vue:
    typescript: 6.0.3

# Only resolve package versions published at least 3 days ago, so a compromised
# or broken release has time to be pulled before it can enter the lockfile.
minimumReleaseAge: 4320

# sqlite3 5.x and its node-gyp 8 pin tar 6, which has unpatched CVEs. Both only
# call tar.extract, which tar 7 keeps, and only when building from source.
overrides:
  tar: ^7.5.21
