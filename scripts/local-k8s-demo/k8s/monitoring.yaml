# The airgap-monitoring service: the same production image the Dockerfile at the
# repo root builds, running in-cluster so the n8n instances can reach it over the
# cluster network instead of the host.
#
# The namespace and the airgap-monitoring-tokens secret are created by the
# Makefile before this file is applied.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airgap-monitoring-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airgap-monitoring
  namespace: monitoring
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the SQLite database sits on a ReadWriteOnce
  # volume that a second pod could not mount while the old one still holds it,
  # so a rolling restart would deadlock.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: airgap-monitoring
  template:
    metadata:
      labels:
        app: airgap-monitoring
    spec:
      # The image runs as the `node` user (uid 1000); fsGroup makes the mounted
      # volume writable for it, so SQLite can create its database file.
      securityContext:
        fsGroup: 1000
      containers:
        - name: airgap-monitoring
          image: airgap-monitoring:local
          # Never: the image is side-loaded into kind, not pulled from a registry.
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          # The image already sets N8N_DB_PATH=/data/database.sqlite; the read and write
          # tokens are deployment-specific, and the API refuses to boot without them.
          envFrom:
            - secretRef:
                name: airgap-monitoring-tokens
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: airgap-monitoring-data
---
apiVersion: v1
kind: Service
metadata:
  name: airgap-monitoring
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: airgap-monitoring
  ports:
    - name: http
      port: 3000
      targetPort: http
