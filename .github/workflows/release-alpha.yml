name: Release Alpha

# Publishes the tip of main as `alpha` plus the full commit sha. Versioned
# releases (`{version}`, `latest`, `stable`) come from release-publish.yml.
on:
  push:
    branches: [main]
    # Only what ends up in the image. A docs-only merge produces no image, so
    # not every main commit has a sha tag.
    paths:
      - 'apps/api/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/release-alpha.yml'
  workflow_dispatch:
    inputs:
      push_enabled:
        description: 'Push the image to GHCR (disable for a dry-run build)'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: release-alpha-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/n8n-airgap-monitoring

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Lint, typecheck, build & test
        uses: ./.github/actions/test

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # QEMU is only needed for the emulated arm64 leg of the build.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # A dispatch can opt out for a dry run; a push to main always publishes.
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_enabled }}
          tags: |
            ${{ env.IMAGE }}:alpha
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
