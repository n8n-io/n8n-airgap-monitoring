name: Retag Image

# Points published tags at an image that is already in GHCR. It cannot build or
# delete anything.
#
# Every release pushes `{version}`, `latest` and `stable` from one build, so the
# three always agree at publish time and `latest` and `stable` start out as
# synonyms. They differ in what they promise: `latest` is the newest release,
# `stable` is the newest release we still recommend. When a release turns out
# broken, this workflow moves `stable` (and `latest`, if the release should be
# hidden entirely) back onto the previous version until a fix ships. Run it with
# source = the known-good version, e.g. `1.0.0`, and tags = `stable`. Releasing
# the fix moves both tags forward again, so the divergence is temporary by
# construction.
on:
  workflow_dispatch:
    inputs:
      source:
        description: >-
          Version whose image the tags should point at (e.g. "1.0.0"). A digest
          (sha256:...) is accepted too.
        required: true
        type: string
      tags:
        description: Space-separated tags to move (e.g. "stable" or "latest stable")
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: retag-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/n8n-airgap-monitoring

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Move tags
        env:
          SOURCE: ${{ inputs.source }}
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail

          digest_of() {
            docker buildx imagetools inspect --format '{{json .Manifest}}' "$1" 2>/dev/null \
              | jq -r '.digest' || true
          }

          if [[ "$SOURCE" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            SOURCE_REF="${IMAGE}@${SOURCE}"
          else
            SOURCE_REF="${IMAGE}:${SOURCE}"
          fi

          # Resolve the source to a digest once, and fail before any tag moves if
          # it does not exist, so a typo cannot leave the tags half-moved.
          DIGEST=$(digest_of "$SOURCE_REF")
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::${SOURCE_REF} does not exist. Nothing was changed."
            exit 1
          fi
          echo "${SOURCE_REF} is ${DIGEST}"

          for tag in $TAGS; do
            if [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::${tag} is a release version. Version tags are immutable; only moving tags like stable or latest can be retargeted. Nothing was changed."
              exit 1
            fi
          done

          for tag in $TAGS; do
            echo "${IMAGE}:${tag} was $(digest_of "${IMAGE}:${tag}" | grep . || echo absent)"
            # Copies the multi-arch index as-is, so the tag resolves to the same
            # digest as the source.
            docker buildx imagetools create --tag "${IMAGE}:${tag}" "${IMAGE}@${DIGEST}"
            landed=$(digest_of "${IMAGE}:${tag}")
            if [[ "$landed" != "$DIGEST" ]]; then
              echo "::error::${IMAGE}:${tag} landed as ${landed}, expected ${DIGEST}"
              exit 1
            fi
            echo "${IMAGE}:${tag} now ${landed}"
          done
