name: Benchmark Ingest

# Sends POST /api/v1/instance-reports to one replica under the reference
# chart's limits at a ladder of rates and reports, per step, whether it kept up.
# Fails only when the required 170 req/s step is not held; rerun once to rule
# out a slow runner. See scripts/bench/ingest/README.md.
on:
  # TEMP: one run on PR #34 to check the workflow; remove before merging.
  pull_request:
    paths:
      - '.github/workflows/benchmark-ingest.yml'
      - 'scripts/bench/ingest/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, commit or refs/pull/<n>/head to benchmark. Empty = the branch above.'
        required: false
        type: string
      steps:
        description: 'Rates to send, in req/s'
        required: true
        default: '100,170,300,400,500,600'
        type: string
      step_seconds:
        description: 'Seconds per step'
        required: true
        default: '20'
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-ingest-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    # Pinned: runs are only comparable on the same runner image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}

      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: '2.3.0'

      - name: Start server
        run: docker compose -f scripts/bench/ingest/compose.yml up -d --build --wait

      - name: Benchmark
        env:
          STEPS: ${{ inputs.steps }}
          STEP_SECONDS: ${{ inputs.step_seconds }}
        run: k6 run -e STEPS="$STEPS" -e STEP_SECONDS="$STEP_SECONDS" -e SUMMARY="$GITHUB_STEP_SUMMARY" scripts/bench/ingest/ingest.k6.js

      - name: Server logs
        if: failure()
        run: docker compose -f scripts/bench/ingest/compose.yml logs --tail 200

      # A hosted runner is thrown away after the job anyway; this keeps a
      # self-hosted one clean.
      - name: Stop server
        if: always()
        run: docker compose -f scripts/bench/ingest/compose.yml down -v
